[workspace]
resolver = "3"
members = ["crates/quantex", "tests/contract"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Drswith/quantex-cli"
homepage = "https://github.com/Drswith/quantex-cli#readme"

[workspace.dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
