name: Sandbox Tests

# Advisory signal only: this workflow is intentionally NOT a required merge gate.
#
# It no longer runs per pull request or on a standing schedule. It never gated
# anything on PRs -- it is advisory by design, fork PRs skipped it for lack of
# secrets, and its failures were external Modal capacity rather than repository
# regressions -- so automatic runs bought a signal nothing consumed. Manual
# dispatch keeps the coverage where it is actually read.

on:
  workflow_dispatch:

concurrency:
  group: sandbox-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  BUN_INSTALL_CACHE_DIR: .bun/install/cache
  QTX_ISOLATION_AGENTS: pi,opencode
  QTX_ISOLATION_COMMAND_TIMEOUT_MS: 600000

permissions:
  contents: read

jobs:
  sandbox-tests:
    name: sandbox-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Run Modal sandbox lifecycle smoke
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: bun run test:sandbox
