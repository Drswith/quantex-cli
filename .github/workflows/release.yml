name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      npm_tag: ${{ steps.candidate.outputs.npm_tag }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Require an immutable version tag
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Fetch the release branch and tags
        run: |
          git fetch --force origin \
            "refs/heads/main:refs/remotes/origin/main" \
            --tags

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and stage exact release candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:candidate

      - name: Upload exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ steps.candidate.outputs.tag }}
          if-no-files-found: error
          path: release-candidate
          retention-days: 30

  publish:
    needs: build-candidate
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.build-candidate.outputs.tag }}
          path: release-candidate

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Create release bot token
        id: release-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Validate downloaded candidate
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-candidate.outputs.version }}
        run: bun run scripts/release/verify-release-candidate.ts download-check

      - name: Resolve exact npm publication state
        id: npm
        env:
          RELEASE_VERSION: ${{ needs.build-candidate.outputs.version }}
        run: bun run scripts/release/verify-release-candidate.ts npm-state

      - name: Verify existing npm candidate integrity
        if: ${{ steps.npm.outputs.published == 'true' }}
        env:
          REGISTRY_INTEGRITY: ${{ steps.npm.outputs.integrity }}
        run: |
          set -euo pipefail
          candidate_integrity="$(node -p "require('./release-candidate/candidate.json').npm.integrity")"
          test "${REGISTRY_INTEGRITY}" = "${candidate_integrity}"

      - name: Create or recover draft GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --notes-file release-candidate/release-notes.md \
              --title "${RELEASE_TAG}" \
              --verify-tag
          fi
          gh release edit "${RELEASE_TAG}" \
            --notes-file release-candidate/release-notes.md \
            --title "${RELEASE_TAG}"

      - name: Reconcile candidate release assets
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" release-candidate/assets/* --clobber

      - name: Verify staged GitHub Release assets
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: bun run scripts/release/verify-release-candidate.ts assets-check

      - name: Publish exact CLI candidate tarball
        if: ${{ steps.npm.outputs.published != 'true' }}
        run: npm publish release-candidate/npm/*.tgz --access public --ignore-scripts --tag ${{ needs.build-candidate.outputs.npm_tag }}

      - name: Verify npm registry closure
        env:
          RELEASE_VERSION: ${{ needs.build-candidate.outputs.version }}
        run: bun run scripts/release/verify-release-candidate.ts registry-closure

      - name: Publish recovered GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          PRERELEASE: ${{ needs.build-candidate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          if [ "${is_draft}" = "true" ]; then
            if [ "${PRERELEASE}" = "true" ]; then
              gh release edit "${RELEASE_TAG}" --draft=false --latest=false --prerelease=true
            else
              gh release edit "${RELEASE_TAG}" --draft=false --latest=true --prerelease=false
            fi
          fi

      - name: Verify public release closure
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = "false"
