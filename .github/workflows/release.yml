name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require an immutable version tag
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Fetch protected branches and tags
        run: |
          release_version="$(node -p "require('./package.json').version")"
          if [[ "${release_version}" == *-* ]]; then
            target_branch=beta
          else
            target_branch=main
          fi
          git fetch --force origin \
            "refs/heads/${target_branch}:refs/remotes/origin/${target_branch}" \
            --tags

      - name: Validate immutable release identity
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run ci:release-publish-contract

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package once
        run: bun run build

      - name: Build standalone binaries once
        run: bun run build:bin

      - name: Generate release artifacts
        run: bun run release:artifacts

      - name: Smoke check current runner release binary
        run: bun run release:smoke

      - name: Verify bundled Core package contents
        run: bun run package:check:core

      - name: Stage exact release candidate
        run: bun run scripts/stage-release-candidate.ts release-candidate

      - name: Verify exact candidate tarball contents
        run: bun run scripts/verify-package-distribution.ts release-candidate/npm/*.tgz

      - name: Upload exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: release-candidate
          retention-days: 30

  publish:
    needs: build-candidate
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.build-candidate.outputs.tag }}
          path: release-candidate

      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Create release bot token
        id: release-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Validate downloaded candidate
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-candidate.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile, stat } from 'node:fs/promises'

          const candidate = JSON.parse(await readFile('release-candidate/candidate.json', 'utf8'))
          if (candidate.tag !== process.env.RELEASE_TAG || candidate.version !== process.env.RELEASE_VERSION) {
            throw new Error('Downloaded candidate identity does not match validated job outputs.')
          }
          for (const [directory, files] of [
            ['assets', candidate.assets],
            ['npm', [candidate.npm]],
            ['', [candidate.releaseNotes]],
          ]) {
            for (const file of files) {
              const path = `release-candidate/${directory}/${file.name}`
              const contents = await readFile(path)
              const sha256 = createHash('sha256').update(contents).digest('hex')
              if ((await stat(path)).size !== file.size || sha256 !== file.sha256) {
                throw new Error(`Downloaded candidate file mismatch: ${file.name}`)
              }
            }
          }
          NODE

      - name: Resolve exact npm publication state
        id: npm
        env:
          RELEASE_VERSION: ${{ needs.build-candidate.outputs.version }}
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if integrity="$(npm view "quantex-cli@${RELEASE_VERSION}" dist.integrity --json 2>"${error_file}")"; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "integrity=$(printf '%s' "${integrity}" | tr -d '[:space:]\"')" >> "${GITHUB_OUTPUT}"
          elif grep -Eq 'E404|404 Not Found' "${error_file}"; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            tr '\n' ' ' < "${error_file}"
            exit 1
          fi
          rm -f "${error_file}"

      - name: Verify existing npm candidate integrity
        if: ${{ steps.npm.outputs.published == 'true' }}
        env:
          REGISTRY_INTEGRITY: ${{ steps.npm.outputs.integrity }}
        run: |
          set -euo pipefail
          candidate_integrity="$(node -p "require('./release-candidate/candidate.json').npm.integrity")"
          test "${REGISTRY_INTEGRITY}" = "${candidate_integrity}"

      - name: Create or recover draft GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --notes-file release-candidate/release-notes.md \
              --title "${RELEASE_TAG}" \
              --verify-tag
          fi
          gh release edit "${RELEASE_TAG}" \
            --notes-file release-candidate/release-notes.md \
            --title "${RELEASE_TAG}"

      - name: Reconcile candidate release assets
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" release-candidate/assets/* --clobber

      - name: Verify staged GitHub Release assets
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json assets,tagName > release-candidate/github-release.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const candidate = JSON.parse(await readFile('release-candidate/candidate.json', 'utf8'))
          const release = JSON.parse(await readFile('release-candidate/github-release.json', 'utf8'))
          if (release.tagName !== candidate.tag) throw new Error('GitHub Release tag does not match the candidate.')
          const assets = new Map(release.assets.map(asset => [asset.name, asset]))
          for (const asset of candidate.assets) {
            const uploaded = assets.get(asset.name)
            if (uploaded?.size !== asset.size || uploaded.digest !== `sha256:${asset.sha256}`) {
              throw new Error(`GitHub Release asset is missing or does not match: ${asset.name}`)
            }
          }
          NODE

      - name: Publish exact CLI candidate tarball
        if: ${{ steps.npm.outputs.published != 'true' }}
        run: npm publish release-candidate/npm/*.tgz --access public --ignore-scripts --tag ${{ needs.build-candidate.outputs.npm_tag }}

      - name: Verify npm registry closure
        env:
          RELEASE_VERSION: ${{ needs.build-candidate.outputs.version }}
        run: |
          set -euo pipefail
          candidate_integrity="$(node -p "require('./release-candidate/candidate.json').npm.integrity")"
          for attempt in $(seq 1 12); do
            registry_integrity="$(npm view "quantex-cli@${RELEASE_VERSION}" dist.integrity --json 2>/dev/null | tr -d '[:space:]\"' || true)"
            if [ "${registry_integrity}" = "${candidate_integrity}" ]; then
              exit 0
            fi
            if [ "${attempt}" -lt 12 ]; then sleep 5; fi
          done
          echo "npm registry integrity did not converge to the validated candidate."
          exit 1

      - name: Publish recovered GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          PRERELEASE: ${{ needs.build-candidate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          if [ "${is_draft}" = "true" ]; then
            if [ "${PRERELEASE}" = "true" ]; then
              gh release edit "${RELEASE_TAG}" --draft=false --latest=false --prerelease=true
            else
              gh release edit "${RELEASE_TAG}" --draft=false --latest=true --prerelease=false
            fi
          fi

      - name: Verify public release closure
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          RELEASE_TAG: ${{ needs.build-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = "false"
