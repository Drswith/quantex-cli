name: Release
run-name: Release ${{ github.event.inputs.tag || github.ref_name }}

# A version tag builds, verifies, and publishes. Changes to the pipeline itself run
# everything except publishing, so the pipeline is proven before a tag needs it.
on:
  push:
    tags: ['v*']
    branches: [claude/quantex-cli-rust-rewrite-1b3c4a]
    paths:
      - .github/workflows/release.yml
      - crates/release/**
      - scripts/release/**
      - install.sh
      - install.ps1
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/release/**
      - scripts/release/**
      - install.sh
      - install.ps1
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish again (for example v2.0.0-alpha.1)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The release that existing installs upgrade from, used to prove they can.
  V1_REFERENCE: v1.13.6

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      publish: ${{ steps.ref.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Resolve what to build
        id: ref
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the version
        id: version
        run: |
          set -eu
          if [ "${{ steps.ref.outputs.publish }}" = true ]; then
            tag="${{ steps.ref.outputs.ref }}"
          else
            tag="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "quantex") | .version')"
          fi
          cargo run -q -p quantex-release -- version --tag "$tag" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, binary: quantex-linux-x64, smoke: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, binary: quantex-linux-arm64, smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, binary: quantex-darwin-arm64, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, binary: quantex-darwin-x64, smoke: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, binary: quantex-windows-x64.exe, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          # A static C runtime keeps the Windows binary free of a VC++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked -p quantex --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/quantex$suffix" "dist/${{ matrix.binary }}"
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          set -eu
          reported="$("dist/${{ matrix.binary }}" --version)"
          test "$reported" = "${{ needs.prepare.outputs.version }}"
          "dist/${{ matrix.binary }}" commands --json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  package:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release/binaries
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package release assets and npm packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          cargo run -q -p quantex-release -- package --version "$VERSION" --binaries release/binaries --out release/assets
          cargo run -q -p quantex-release -- npm --version "$VERSION" --binaries release/binaries --out release/npm \
            --readme README.md --license LICENSE
          mkdir -p release/tarballs
          for dir in release/npm/*; do (cd release/tarballs && npm pack "../../$dir" --silent); done
          ls -l release/assets release/tarballs
      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -eu
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" version "]") || index($0, " " version)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            echo "Quantex CLI $VERSION." > release/notes.md
          fi
          if [ "$PRERELEASE" = true ]; then
            {
              echo
              echo "This is a prerelease. Install it with \`npm install -g quantex-cli@next\`, or download a binary below."
              echo "Installs on the stable channel are not offered prereleases."
            } >> release/notes.md
          fi
          cat release/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          if-no-files-found: error

  verify:
    needs: [prepare, package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: install.sh installs the release
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          python3 -m http.server --bind 127.0.0.1 --directory release/assets 8765 > /dev/null 2>&1 &
          sleep 2
          export HOME="$RUNNER_TEMP/install-home"
          mkdir -p "$HOME"
          QUANTEX_DOWNLOAD_BASE=http://127.0.0.1:8765 QUANTEX_INSTALL_DIR="$RUNNER_TEMP/install-bin" sh install.sh
          test "$("$RUNNER_TEMP/install-bin/qtx" --version)" = "$VERSION"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["self"]["installSource"] == "binary"' \
            "$HOME/.quantex/state.json"
      - name: install.ps1 installs the release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '--bind', '127.0.0.1', '--directory', 'release/assets', '8765' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:QUANTEX_DOWNLOAD_BASE = 'http://127.0.0.1:8765'
          $env:QUANTEX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'install-bin'
          ./install.ps1
          $reported = & (Join-Path $env:QUANTEX_INSTALL_DIR 'qtx.exe') --version
          Stop-Process -Id $server.Id
          if ($reported -ne $env:VERSION) { throw "installed binary reports $reported, expected $env:VERSION" }
      - name: v1 installs can upgrade to the release
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) asset=quantex-darwin-arm64 ;;
            Linux-x86_64) asset=quantex-linux-x64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/v1"
          gh release download "$V1_REFERENCE" --repo Drswith/quantex-cli --dir "$RUNNER_TEMP/v1" \
            --pattern "$asset.tar.gz" --pattern SHA256SUMS.txt
          (cd "$RUNNER_TEMP/v1" && grep " $asset.tar.gz\$" SHA256SUMS.txt | shasum -a 256 --check && tar -xzf "$asset.tar.gz" "$asset")
          sh scripts/release/v1-upgrade-check.sh release/assets "$RUNNER_TEMP/v1/$asset" "$VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The npm packages install and run
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) platform=linux-x64 ;;
            macOS-arm64) platform=darwin-arm64 ;;
            Windows-*) platform=win32-x64 ;;
          esac
          prefix="$RUNNER_TEMP/npm-prefix"
          npm install -g --prefix "$prefix" --offline --no-audit --no-fund \
            "release/tarballs/quantex-cli-$platform-$VERSION.tgz" "release/tarballs/quantex-cli-$VERSION.tgz"
          if [ "$RUNNER_OS" = Windows ]; then bin="$prefix"; else bin="$prefix/bin"; fi
          test "$("$bin/qtx" --version)" = "$VERSION"
          "$bin/quantex" doctor --json > doctor.json || true
          node -e 'const d = require("./doctor.json"); if (d.data.self.installSource !== "npm") { console.error(d.data.self); process.exit(1) }'

  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/assets/* --clobber
          elif [ "$PRERELEASE" = true ]; then
            # A prerelease is never "latest", so stable installs keep upgrading to stable.
            gh release create "$TAG" release/assets/* --verify-tag --title "$TAG" \
              --notes-file release/notes.md --prerelease --latest=false
          else
            gh release create "$TAG" release/assets/* --verify-tag --title "$TAG" \
              --notes-file release/notes.md --latest
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm packages
        env:
          # Trusted publishing covers packages configured for it; a token covers the
          # first publish of a platform package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              npm publish "./$1" --access public --provenance --tag "$NPM_TAG"
            fi
          }
          # Platform packages first: the launcher package depends on them.
          for dir in release/npm/quantex-cli-*; do publish "$dir"; done
          publish release/npm/quantex-cli
