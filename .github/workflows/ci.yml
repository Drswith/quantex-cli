name: CI

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 3 * * 1'

# Cancel superseded pull request runs only. The edited activity type re-validates
# an edited PR body, so a burst of edits would otherwise leave several superseded
# three-platform matrices running.
#
# Push runs are keyed by commit and never cancelled: tag-release will only tag a
# release commit whose exact SHA has a successful ci.yml run, so cancelling a
# push run can silently cost a release when two merges land back to back.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  BUN_INSTALL_CACHE_DIR: .bun/install/cache

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.taxonomy.outputs.changed_files }}
      commits_json: ${{ steps.context.outputs.commits_json }}
      run_test_matrix: ${{ steps.taxonomy.outputs.run_test_matrix }}
      scope: ${{ steps.taxonomy.outputs.scope }}
      trusted_pr: ${{ steps.context.outputs.trusted_pr }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Collect CI context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run ci:context

      - name: Classify change scope
        id: taxonomy
        env:
          CHANGED_FILES_AVAILABLE: ${{ steps.context.outputs.changed_files_available }}
          CHANGED_FILES_JSON: ${{ steps.context.outputs.changed_files }}
        run: bun run ci:path-taxonomy

  lint:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun

      - run: bun run memory:check
      - run: bun run openspec:validate
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

  governance:
    if: github.event_name == 'pull_request'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun

      - name: Read base package version for release PR validation
        id: base-version
        if: startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          content="$(gh api "repos/${{ github.repository }}/contents/package.json?ref=${BASE_SHA}" --jq '.content')"
          echo "base_version=$(printf '%s' "${content}" | base64 -d | jq -r '.version')" >> "$GITHUB_OUTPUT"

      - name: Validate release PR policy
        id: release-pr
        if: startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
        env:
          CHANGED_FILES_JSON: ${{ needs.classify.outputs.changed_files }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_BASE_VERSION: ${{ steps.base-version.outputs.base_version }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bun run ci:release-pr-policy
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Validate PR body
        env:
          CHANGED_FILES_JSON: ${{ needs.classify.outputs.changed_files }}
          PR_IS_VALIDATED_RELEASE_PR: ${{ steps.release-pr.outputs.validated == 'true' }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun run pr:body:check

      - name: Validate PR commit policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS_JSON: ${{ needs.classify.outputs.commits_json }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bun run ci:commit-policy

  test-ubuntu:
    name: test (ubuntu-latest)
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun run build

      - name: Run full test suite
        if: needs.classify.outputs.run_test_matrix == 'true'
        run: bun run test

      - name: Run minimal build guard for process-only changes
        if: needs.classify.outputs.run_test_matrix != 'true'
        env:
          CHANGE_SCOPE: ${{ needs.classify.outputs.scope }}
        run: echo "Process-only change (${CHANGE_SCOPE}); minimal Ubuntu build guard only."

      - run: bun run package:check

  test-windows:
    name: test (windows-latest)
    needs: classify
    if: needs.classify.outputs.run_test_matrix == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun run build
      - run: bun run test

  test-macos:
    name: test (macos-latest)
    needs: classify
    if: needs.classify.outputs.run_test_matrix == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun run build
      - run: bun run test
