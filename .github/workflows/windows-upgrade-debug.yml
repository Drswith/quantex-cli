# Temporary: diagnoses v1's Windows self-upgrade against built release assets.
name: Windows upgrade debug

on:
  push:
    branches: [claude/quantex-cli-rust-rewrite-1b3c4a]
    paths:
      - .github/workflows/windows-upgrade-debug.yml
      - scripts/release/v1-upgrade-check.ps1

permissions:
  actions: read
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
          run-id: 40743713987
          github-token: ${{ github.token }}
      - name: Download v1.13.5 and v1.13.6
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.13.5 --repo Drswith/quantex-cli --dir v135 --pattern quantex-windows-x64.exe.zip
          Expand-Archive -LiteralPath v135/quantex-windows-x64.exe.zip -DestinationPath v135 -Force
          gh release download v1.13.6 --repo Drswith/quantex-cli --dir v136
      - name: v1.13.5 upgrades to v1.13.6
        if: always()
        shell: pwsh
        run: ./scripts/release/v1-upgrade-check.ps1 -Assets v136 -V1Binary v135/quantex-windows-x64.exe -Expected 1.13.6
      - name: v1.13.5 upgrades to the Rust release
        if: always()
        shell: pwsh
        run: ./scripts/release/v1-upgrade-check.ps1 -Assets release/assets -V1Binary v135/quantex-windows-x64.exe -Expected 2.0.0-alpha.1
