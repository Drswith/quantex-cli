name: Seal Release

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Protected branch head to seal as an immutable version tag
        required: true
        default: main
        type: choice
        options:
          - main
          - beta

permissions:
  actions: write
  contents: write

concurrency:
  group: seal-release-${{ github.event.inputs.target_branch }}
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact protected-branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Refresh protected branches and tags
        run: |
          git fetch --force origin \
            "refs/heads/${{ github.event.inputs.target_branch }}:refs/remotes/origin/${{ github.event.inputs.target_branch }}" \
            --tags

      - name: Validate release seal
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        run: bun run scripts/release-seal-contract.ts seal

      - name: Create or verify immutable release tag
        env:
          RELEASE_SHA: ${{ steps.release.outputs.commit_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            test "${existing_sha}" = "${RELEASE_SHA}"
          else
            git tag --annotate "${RELEASE_TAG}" "${RELEASE_SHA}" --message "${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Explicitly dispatch immutable tag publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "${RELEASE_TAG}"
