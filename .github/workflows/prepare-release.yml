name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Protected branch whose Release PR should be prepared
        required: true
        default: main
        type: choice
        options:
          - main
          - beta

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: prepare-release-${{ github.event.inputs.target_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Refresh protected branch
        run: git fetch --force origin "refs/heads/${{ github.event.inputs.target_branch }}:refs/remotes/origin/${{ github.event.inputs.target_branch }}"

      - name: Resolve Release PR preparation
        id: release-target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        run: bun run scripts/release-target-resolution.ts

      - name: Print preparation resolution
        run: |
          echo "mode=${{ steps.release-target.outputs.mode }}"
          echo "target_branch=${{ steps.release-target.outputs.target_branch }}"
          echo "target_sha=${{ steps.release-target.outputs.target_sha }}"
          echo "source_ci_run_id=${{ steps.release-target.outputs.source_ci_run_id }}"
          echo "reason=${{ steps.release-target.outputs.reason }}"

      - name: Create release bot token
        id: release-bot-token
        if: ${{ steps.release-target.outputs.mode == 'pr' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Prepare Release PR
        if: ${{ steps.release-target.outputs.mode == 'pr' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-bot-token.outputs.token }}
          target-branch: ${{ steps.release-target.outputs.target_branch }}
          config-file: ${{ steps.release-target.outputs.config_file }}
          manifest-file: .release-please-manifest.json
          skip-github-release: true
