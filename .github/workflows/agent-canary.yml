name: Agent Canaries

# Advisory real-agent signal. This workflow intentionally is not a required
# merge gate: upstream registries and installers are external dependencies.
# GitHub-hosted jobs provide the disposable HOME that local development cannot.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/ci/agent-canary-matrix.ts'
      - 'scripts/smoke/lifecycle-smoke.ts'
      - '.github/workflows/agent-canary.yml'
      - 'package.json'
      - 'bun.lock'

  workflow_dispatch:
    inputs:
      scope:
        description: Canary scope to run
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

  schedule:
    - cron: '0 6 * * 6'

concurrency:
  group: agent-canary-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve canary matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      QTX_CANARY_SCOPE: ${{ github.event_name == 'schedule' && 'full' || github.event_name == 'workflow_dispatch' && inputs.scope || 'quick' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: matrix
        name: Generate catalog matrix
        shell: bash
        run: |
          # Use Bun directly so the machine-readable matrix is not prefixed by
          # the package-script banner that `bun run` writes to stdout.
          matrix="$(bun scripts/ci/agent-canary-matrix.ts --scope "$QTX_CANARY_SCOPE")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  canary:
    name: Canary (${{ matrix.agent }}, ${{ matrix.coverage }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      # Never use the runner user's persistent home for an agent install.
      # Each matrix entry gets a fresh Linux runner, so /tmp is isolated per job.
      HOME: /tmp/quantex-home
      BUN_INSTALL: /tmp/quantex-home/.bun
      BUN_INSTALL_CACHE_DIR: .bun/install/cache
      CONFIGURE: ${{ matrix.setup == 'skip-interactive-configuration' && 'false' || '' }}
      DISABLE_AUTOUPDATER: ${{ matrix.disableUpdates && '1' || '' }}
      DISABLE_UPDATES: ${{ matrix.disableUpdates && '1' || '' }}
      QTX_ISOLATION_AGENTS: ${{ matrix.agent }}
      QTX_ISOLATION_SCENARIOS: probe
      QTX_CANARY_COVERAGE: ${{ matrix.coverage }}
      QTX_CANARY_REQUIRE_VERSION: ${{ matrix.requireVersion }}
      QTX_CANARY_PROVIDER: ${{ matrix.provider }}
      QTX_CANARY_SETUP: ${{ matrix.setup }}
      QTX_CANARY_SOURCE_CONFLICT: ${{ matrix.sourceConflictProbe }}
      QTX_ISOLATION_COMMAND_TIMEOUT_MS: 600000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          # Real agents may require a newer Bun than Quantex's reproducible
          # build pin. Keep this override scoped to the advisory canary.
          bun-version: 1.3.14
      - name: Set up Deno provider
        if: matrix.provider == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: latest
      - name: Set up uv provider
        if: matrix.provider == 'uv'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Prepare disposable home
        run: |
          mkdir -p "$HOME" "$BUN_INSTALL" "$HOME/.local/bin"
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Acquire Devin binary without account setup
        if: matrix.coverage == 'binary-lifecycle'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            bash -o pipefail -c 'curl -fsSL https://cli.devin.ai/install.sh | bash' </dev/null
          installer_status=$?
          set -e

          if [[ ! -x "$HOME/.local/bin/devin" ]]; then
            echo "The official installer did not acquire the Devin executable (exit $installer_status)." >&2
            exit 1
          fi

          "$HOME/.local/bin/devin" version
          {
            echo '### Devin credential-free coverage'
            echo '- Binary acquisition and version: verified'
            echo '- Quantex adoption, inspect, list, and version: pending lifecycle probe'
            echo '- Account setup and authentication: deferred; requires a credentialed test identity'
            echo "- Official installer status after entering setup: $installer_status"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run focused lifecycle probe
        run: bun run scripts/smoke/lifecycle-smoke.ts "$QTX_ISOLATION_AGENTS"
      - name: Record Devin binary lifecycle result
        if: success() && matrix.coverage == 'binary-lifecycle'
        run: |
          echo '- Quantex adoption, inspect, list, version, and untracking: verified' >> "$GITHUB_STEP_SUMMARY"
